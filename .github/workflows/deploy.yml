name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=frontend/node_modules \
            --exclude=frontend/.next \
            --exclude=backend/target \
            .
          cp /tmp/deploy.tar.gz deploy.tar.gz

      - name: Copy project to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/opt/task-manager"

      - name: Deploy containers
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,NEXT_PUBLIC_API_URL,CORS_ALLOWED_ORIGINS
          script: |
            set -e
            sudo mkdir -p /opt/task-manager
            cd /opt/task-manager
            sudo tar -xzf deploy.tar.gz

            printf 'DB_PASSWORD=%s\nNEXT_PUBLIC_API_URL=%s\nCORS_ALLOWED_ORIGINS=%s\n' \
              "$DB_PASSWORD" "$NEXT_PUBLIC_API_URL" "$CORS_ALLOWED_ORIGINS" \
              | sudo tee .env >/dev/null

            sudo docker compose pull
            sudo docker compose up -d --build --remove-orphans
            sudo docker compose ps
